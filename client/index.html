<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-page SEO tags (title, description, OG, Twitter, JSON-LD, canonical)
         are injected at build time via react-helmet-async + vite-prerender-plugin.
         A default <title> is provided as a fallback for the SPA catch-all route. -->
    <title>Specter — Open-Source Bitcoin Self-Custody</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0e1a" />

    <!-- Fonts: Inter is loaded via index.css (@import), which is the only
         typeface actually referenced by tailwind.config.ts / index.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" prerender src="/src/prerender.tsx"></script>
  </body>
</html>
